[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-agent-platform"
version = "0.1.0"
description = "Configurable local-first AI agents with workspace tools and SQLite audit logs"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pypdf==6.1.3",
  "python-docx==1.2.0",
  "filelock==3.20.0",
  "psutil==7.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "reportlab==4.4.4"]

[project.scripts]
local-agents = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
